<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Joystick Camera Control</title>
  <desc id="desc">A bold RoomOS-style joystick with two control buttons.</desc>
  <defs>
    <mask id="control-cutouts" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="white"/>
      <circle cx="132" cy="392" r="23" fill="black"/>
      <circle cx="380" cy="392" r="23" fill="black"/>
